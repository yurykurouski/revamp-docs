      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      campaignId:
                        type: string
                        description: The lead id (kept for compatibility)
                      leadId:
                        $ref: '#/components/schemas/ObjectId'
                      status:
                        type: string
                        enum:
                          - REJECTED
                      reason:
                        type: string
        '400':
          description: '`INVALID_ID` or `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LeadNotFound'
        '409':
          description: '`LEAD_NOT_REJECTABLE`: outreach already approved, or the lead is closed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /outreach/{id}/test:
    post:
      tags:
        - Outreach
      operationId: sendTestEmail
      summary: Simulate sending the current draft to the operator's own address
      description: |
        Goes to the operator, not to the business, so it skips the approval gate; it carries no tracking pixel and never
        changes the lead or its campaign. Delivery is simulated (REV-221): the message is rendered From the studio sender
        and nothing is delivered or stored. Waits up to 30 s for the email worker.
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestEmailOutreach'
            example:
              testEmail: owner@studio.example
              subject: A new home page for Smile Dental Clinic
              body: |-
                Hello Anna,

                …
      responses:
        '200':
          description: Simulated, not delivered
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - to
                      - from
                      - subject
                      - simulated
                    properties:
                      to:
                        type: string
                        format: email
                      from:
                        type: string
                        example: '"Smile Studio" <hello@smile-studio.example>'
                      subject:
                        type: string
                      simulated:
                        type: boolean
                        enum:
                          - true
        '400':
          description: '`INVALID_ID` or `VALIDATION_ERROR`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LeadNotFound'
        '409':
          description: '`SENDER_NOT_CONFIGURED`: the studio has no sender yet; the owner sets it with `PUT /organization/sender`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: '`EMAIL_SEND_FAILED`: the workers could not render the simulated message'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: '`EMAIL_TEST_TIMEOUT`: the workers did not answer within 30 s (the waiting job is removed)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discovery:
    post:
      tags:
        - Discovery
      operationId: startDiscovery
