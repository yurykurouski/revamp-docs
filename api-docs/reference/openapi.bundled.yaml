              niche: dental
              location: Vilnius, Lithuania
              limit: 20
      responses:
        '202':
          description: Search queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - jobId
                    properties:
                      jobId:
                        type: string
              example:
                success: true
                message: Discovery job queued successfully
                data:
                  jobId: '128'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /discovery/reverse-geocode:
    get:
