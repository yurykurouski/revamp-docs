openapi: 3.0.3
info:
  title: Revamp SaaS API
  version: 2.6.0
  description: |
    Revamp finds local businesses with dated websites, audits each site in a real browser, has a model design a new
    home page from the site's own content, and sends the owner a personal email with the prototype **only after an
    operator approves it** (Human-in-the-Loop).

    This specification describes the REST API in `apps/api` (Express 4, TypeScript) of the
    [Revamp-dev](https://github.com/yurykurouski/revamp-dev) monorepo. Long work (audits, generation, publishing,
    email) runs in BullMQ workers; the API stores the request, queues a job and answers at once (`202`), and the
    client polls the resource.

    * **Base URL:** `/api/v1` (`API_PREFIX`). Locally `http://localhost:4000/api/v1`.
    * **Authentication:** `Authorization: Bearer <JWT>` from `POST /auth/register` or `POST /auth/login`
      (HS256, 7 days, no refresh token). Routes marked *public* need no token. See `guides/authentication.md`.
    * **Studios (tenants):** every lead, MVP, campaign and event belongs to the caller's studio. A record of another
      studio answers the same `404` as a missing one.
    * **Roles:** `owner` (everything, plus members), `operator` (reads and writes), `viewer` (reads only; every
      non-GET request answers `403 FORBIDDEN`).
    * **Success envelope:** `{ "success": true, "data": … }`, sometimes with `message`, `pagination` or `total`.
    * **Error envelope:** `{ "success": false, "error": { "code", "message", "details?" } }`; branch on `code`.
      The codes are listed in `ApiErrorCode` and explained in `guides/errors.md`.
    * **Request validation:** every body and query passes a Zod schema of `@revamp/validation` before any work.
      Request schemas in `schemas/requests.yaml` are generated from those Zod schemas.
  contact:
    name: Revamp
    url: https://github.com/yurykurouski/revamp-dev
  license:
    name: Proprietary (diploma project)
    url: https://github.com/yurykurouski/revamp-dev
servers:
  - url: http://localhost:4000/api/v1
    description: Local development stack (`npm run dev` in Revamp-dev)
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness and dependency status
  - name: Auth
    description: Sign-up, sign-in and the current session (REV-206)
  - name: Organization
    description: Members and invitations of the caller's studio; owners only (REV-207)
  - name: Invitations
    description: Public join flow of an invitation link (REV-207)
  - name: Leads
    description: Businesses the studio pursues and their pipeline status
  - name: Audits
    description: Deterministic audit of the lead's site (Playwright, axe-core, web vitals, design critique)
  - name: MVP
    description: The model-designed prototype page, its changes and versions
  - name: Outreach
    description: Human-in-the-Loop approval gate and test sends
  - name: Discovery
    description: Finding local businesses on OpenStreetMap or Google Places
  - name: Tracking
    description: Public endpoints called by email clients and by the published prototype pages
  - name: Lots
    description: Masked listing of open lots for every studio member (REV-233)
  - name: Admin
    description: Platform administrator only (REV-232). Platform audits of businesses no studio owns yet, and lots
paths:
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check the API, MongoDB and Redis
      description: |
        Used by the Docker `HEALTHCHECK` (`curl -f`). `200` when MongoDB is `connected` and Redis is `ready`/`connect`,
        otherwise `503` with the same body. This route does not use the standard envelope.
      security: []
      responses:
        '200':
          description: Every dependency is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                timestamp: '2026-11-22T10:15:00.000Z'
                services:
                  api: healthy
                  mongodb: connected
                  redis: connected
        '503':
          description: MongoDB or Redis is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                timestamp: '2026-11-22T10:15:00.000Z'
                services:
                  api: healthy
                  mongodb: disconnected
                  redis: connected
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Create a studio and its owner, or join by invitation
      description: |
        Without `invitationToken`, creates the studio (`organizationName` is then required) and its owner in one
        transaction and signs in. With `invitationToken`, creates the user and a membership with the invited role; the
        email must match the invitation and `organizationName` is ignored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              newStudio:
                summary: A new studio
                value:
                  email: owner@studio.example
                  password: correct-horse-9
                  organizationName: Pixel Studio
                  name: Anna
              invited:
                summary: Joining by invitation
                value:
                  email: operator@studio.example
                  password: correct-horse-9
                  invitationToken: Zr3x0J9qkM2vT1aYc8LpWq
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
              example:
                success: true
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NzNm…
                  user:
                    id: 673f1b2c9d4e5a0012ab34cd
                    email: owner@studio.example
                    name: Anna
                  organization:
                    id: 673f1b2c9d4e5a0012ab34ce
                    name: Pixel Studio
                  role: owner
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/InvitationEmailMismatch'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          description: '`EMAIL_TAKEN`: an account with this email exists (any letter case)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: EMAIL_TAKEN
                  message: An account with this email already exists
        '410':
          $ref: '#/components/responses/InvitationExpired'
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              email: owner@studio.example
              password: correct-horse-9
      responses:
        '200':
          description: Signed in; the same shape as registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: |
            `INVALID_CREDENTIALS` for a wrong password or an unknown email (the two are not told apart), or
            `UNAUTHENTICATED` when the password is right but the user has no studio any more.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Email or password is incorrect
  /auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentSession
      summary: The signed-in user, studio and role
      description: The role is read from the membership in the database, not from the token, so a changed role shows at once.
      responses:
        '200':
          description: The current session without the token
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/AuthContext'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /organization/members:
    get:
      tags:
        - Organization
      operationId: listMembers
      summary: Members and pending invitations of the studio
      responses:
        '200':
          description: Members and invitations that are still valid (without their tokens)
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/OrganizationMembers'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organization/invitations:
    post:
      tags:
        - Organization
      operationId: createInvitation
      summary: Invite a person to the studio
      description: A pending invitation to the same address is revoked. The token is returned **once**; only its SHA-256 is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitation'
            example:
              email: operator@studio.example
              role: operator
      responses:
        '201':
          description: Invitation created; build the join link `/invite/<token>` from the token
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/CreatedInvitation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`ALREADY_MEMBER`: the address already belongs to a member'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organization/invitations/{id}:
    delete:
      tags:
        - Organization
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
  /organization/sender:
    put:
      tags:
        - Organization
      operationId: setStudioSender
      summary: Set the studio's outreach sender (owners)
      description: |
        Name and address every outreach email of the studio goes out under (REV-221). It can be changed, not removed.
        Approving outreach and test sends need it. Delivery is simulated: nothing leaves the platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioSender'
            example:
              name: Smile Studio
              address: hello@smile-studio.example
      responses:
        '200':
          description: The sender as saved
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - configured
                    properties:
                      configured:
                        type: boolean
                      name:
                        type: string
                        maxLength: 100
                      address:
                        type: string
                        format: email
              example:
                success: true
                data:
                  configured: true
                  name: Smile Studio
                  address: hello@smile-studio.example
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organization/members/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: The member's user id (24-character hexadecimal ObjectId)
        schema:
          $ref: '#/components/schemas/ObjectId'
    patch:
      tags:
        - Organization
      operationId: changeMemberRole
      summary: Change a member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRole'
            example:
              role: viewer
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '409':
          $ref: '#/components/responses/LastOwner'
    delete:
      tags:
        - Organization
      operationId: removeMember
      summary: Remove a member from the studio (the account stays)
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MemberNotFound'
        '409':
          $ref: '#/components/responses/LastOwner'
  /invitations/{token}:
    get:
      tags:
        - Invitations
      operationId: previewInvitation
      summary: What the join page shows
      description: Public; the token in the link is the secret.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: The studio, address, role and expiry
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/InvitationPreview'
              example:
                success: true
                data:
                  organizationName: Pixel Studio
                  email: operator@studio.example
                  role: operator
                  expiresAt: '2026-11-29T10:00:00.000Z'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '410':
          $ref: '#/components/responses/InvitationExpired'
  /invitations/{token}/join:
    post:
      tags:
        - Invitations
      operationId: joinInvitationWithPassword
      summary: Join with the password of an existing account
      description: Public. For an invitee who already has an account with the invited address (also one removed from a studio, whose sign-in gives no studio).
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinInvitation'
            example:
              password: correct-horse-9
      responses:
        '200':
          description: Joined; a session of the invited studio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: '`INVALID_CREDENTIALS`: wrong password or no account with the invited address'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          description: '`ALREADY_MEMBER`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/InvitationExpired'
  /invitations/{token}/accept:
    post:
      tags:
        - Invitations
      operationId: acceptInvitation
      summary: Accept an invitation while signed in
      description: The signed-in user's email must match the invitation; any role may accept.
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: Accepted; a session of the invited studio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/InvitationEmailMismatch'
        '404':
          $ref: '#/components/responses/InvitationNotFound'
        '409':
          description: '`ALREADY_MEMBER`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          $ref: '#/components/responses/InvitationExpired'
  /leads:
    post:
      tags:
        - Leads
      operationId: createLead
      summary: Add a lead and queue its audit
      description: |
        Finds or creates the shared business of the site. If the business already has a completed audit, the lead is
        created `AUDITED` with that audit and MVP generation is queued (`message` says so). Otherwise the lead and
        its first audit (`QUEUED`) are written in one transaction and the audit job is queued.

        If the queue does not accept the job within 5 s, the lead is moved to `AUDIT_FAILED` and the answer is
        `503 AUDIT_QUEUE_UNAVAILABLE` with `details.leadId`; retry with `POST /audits/trigger`.
        Without `contactEmail` the audit takes the email from the site; none is invented.

        Adding a lead claims the studio's exclusive right to contact the business (REV-225) in the same transaction:
        `CONTACT_RIGHT_DAYS` (14 days), then a cooldown of `CONTACT_COOLDOWN_DAYS` (30 days) for every studio. A
        business another studio holds, in cooldown or opted out is refused with a 409 and nothing is created. A refusal
        never names the other studio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLead'
            example:
              businessName: Smile Dental Clinic
              originalUrl: https://smile-dental.example
              niche: dental
              city: Vilnius
              operatorLocale: en
      responses:
        '201':
          description: Lead created
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - id
                      - lead
                      - auditId
                    properties:
                      id:
                        $ref: '#/components/schemas/ObjectId'
                      lead:
                        $ref: '#/components/schemas/Lead'
                      auditId:
                        $ref: '#/components/schemas/ObjectId'
                      jobId:
                        type: string
                        description: BullMQ job id of the audit (or of the generation when an audit was reused)
                      contactRight:
                        type: object
                        description: The contact right claimed with the lead (REV-225)
                        required:
                          - expiresAt
                        properties:
                          expiresAt:
                            type: string
                            format: date-time
              example:
                success: true
                message: Lead created and audit queued successfully
                data:
                  id: 6740a1f09d4e5a0012ab35aa
                  lead:
                    _id: 6740a1f09d4e5a0012ab35aa
                    tenantId: 673f1b2c9d4e5a0012ab34ce
                    businessId: 6740a1f09d4e5a0012ab35a9
                    businessName: Smile Dental Clinic
                    originalUrl: https://smile-dental.example
                    domain: smile-dental.example
                    niche: dental
                    city: Vilnius
                    source: manual
                    operatorLocale: en
                    status: QUEUED
                    tags: []
                    createdAt: '2026-11-22T10:20:00.000Z'
                    updatedAt: '2026-11-22T10:20:00.000Z'
                  auditId: 6740a1f09d4e5a0012ab35ab
                  jobId: '41'
                  contactRight:
                    expiresAt: '2026-12-06T10:20:00.000Z'
        '400':
          description: '`VALIDATION_ERROR` (body), or `INVALID_URL` when `originalUrl` cannot be parsed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: 'originalUrl: Invalid url'
                  details:
                    issues:
                      - validation: url
                        code: invalid_string
                        message: Invalid url
                        path:
                          - originalUrl
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `LEAD_ALREADY_EXISTS`: the studio already has a lead for this site; `details.leadId` is that lead.
            `CONTACT_RIGHT_HELD`: another studio holds the right to contact the business; `details.expiresAt` is when it ends.
            `BUSINESS_IN_COOLDOWN`: a right ended recently; `details.availableAt` is when the business can be claimed again.
            `BUSINESS_OPTED_OUT`: the business, or the contact address, asked not to be contacted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                leadAlreadyExists:
                  value:
                    success: false
                    error:
                      code: LEAD_ALREADY_EXISTS
                      message: Your studio already has a lead for this site
                      details:
                        leadId: 6740a1f09d4e5a0012ab35aa
                contactRightHeld:
                  value:
                    success: false
                    error:
                      code: CONTACT_RIGHT_HELD
                      message: Another studio holds the right to contact this business until 2026-12-06T10:20:00.000Z.
                      details:
                        expiresAt: '2026-12-06T10:20:00.000Z'
        '503':
          $ref: '#/components/responses/AuditQueueUnavailable'
    get:
      tags:
        - Leads
      operationId: listLeads
      summary: List leads with filters and pagination
      description: |
        Offset pagination: `page` (from 1) and `limit` (1–100, default 20). `search` matches a case-insensitive substring
        of the business name, domain, contact email or city (special characters are escaped). Each lead carries a short MVP
        completeness summary (`completeness`) when it has an MVP. The dashboard loads every page with `limit=100`.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: One lead status
          schema:
            $ref: '#/components/schemas/LeadStatus'
        - name: niche
          in: query
          schema:
            $ref: '#/components/schemas/Niche'
        - name: complexity
          in: query
          schema:
            type: string
            enum:
              - ONE_PAGE_BROCHURE
              - SMALL_MULTI_PAGE
              - COMPLEX
              - UNKNOWN
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: One page of leads, one-page brochure sites first, then newest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - pagination
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeadListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                success: true
                data:
                  - _id: 6740a1f09d4e5a0012ab35aa
                    businessName: Smile Dental Clinic
                    originalUrl: https://smile-dental.example
                    domain: smile-dental.example
                    niche: dental
                    status: NEEDS_APPROVAL
                    totalScore: 41
                    tags: []
                    completeness:
                      status: verified
                      score: 92
                      hasCriticalIssues: false
                      criticalIssues: []
                    createdAt: '2026-11-22T10:20:00.000Z'
                    updatedAt: '2026-11-22T10:31:12.000Z'
                pagination:
                  total: 37
                  page: 1
                  limit: 20
                  totalPages: 2
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /leads/stats:
    get:
      tags:
        - Leads
      operationId: getLeadStats
      summary: Counts by status across the whole pipeline
      description: Ignores the list filters; the source of the dashboard's KPI cards.
      responses:
        '200':
          description: Total and per-status counts
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/LeadStats'
              example:
                success: true
                data:
                  total: 37
                  byStatus:
                    QUEUED: 2
                    AUDITED: 5
                    NEEDS_APPROVAL: 9
                    SENT: 12
                    OPENED: 6
                    REJECTED: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /leads/{id}:
    get:
      tags:
        - Leads
      operationId: getLead
      summary: One lead and its latest audit
      description: The audit is the lead's own newest audit, else the completed audit of its business; `null` when there is none.
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      responses:
        '200':
          description: The lead and its audit
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - lead
                      - audit
                    properties:
                      lead:
                        $ref: '#/components/schemas/Lead'
                      audit:
                        type: object
                        allOf:
                          - $ref: '#/components/schemas/Audit'
                        nullable: true
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/LeadNotFound'
  /audits/trigger:
    post:
      tags:
        - Audits
      operationId: triggerAudit
      summary: Run (or retry) the audit of a lead
      description: |
        Allowed for a lead in `QUEUED` or `AUDIT_FAILED`; the lead goes back to `QUEUED`, its `auditError` is cleared
        and a new `Audit` document is created. A lead further along answers `409 LEAD_NOT_AUDITABLE` with
        `details.status`: an audit never moves a lead backwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerAudit'
            example:
              leadId: 6740a1f09d4e5a0012ab35aa
      responses:
        '202':
          description: Audit job queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - leadId
                      - auditId
                      - status
                    properties:
                      leadId:
                        $ref: '#/components/schemas/ObjectId'
                      auditId:
                        $ref: '#/components/schemas/ObjectId'
                      jobId:
                        type: string
                      status:
                        type: string
                        enum:
                          - QUEUED
              example:
                success: true
                message: Audit job queued
                data:
                  leadId: 6740a1f09d4e5a0012ab35aa
                  auditId: 6740a3449d4e5a0012ab35c0
                  jobId: '42'
                  status: QUEUED
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LeadNotFound'
        '409':
          description: '`LEAD_NOT_AUDITABLE`: the lead is not in `QUEUED`/`AUDIT_FAILED`, or changed while the audit was being queued'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: LEAD_NOT_AUDITABLE
                  message: An audit cannot be started while the lead is NEEDS_APPROVAL
                  details:
                    status: NEEDS_APPROVAL
        '503':
          $ref: '#/components/responses/AuditQueueUnavailable'
  /audits/{id}:
    get:
      tags:
        - Audits
      operationId: getAudit
      summary: An audit by its id, or the latest audit of a lead by the lead's id
      description: |
        Audits are shared between studios (one per business), so an audit is returned only when a lead of the
        caller's studio reads it. Given a lead id, the lead's latest audit is returned.
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      responses:
        '200':
          description: The audit
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Audit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: '`AUDIT_NOT_FOUND` (also for an invalid id)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /mvp/providers:
    get:
      tags:
        - MVP
      operationId: listLlmProviders
      summary: LLM providers and models the generation can use
      description: Availability comes from the last capability report of the AI worker in Redis; with no recent report every option is unavailable (`workers_offline`).
      responses:
        '200':
          description: Providers with their models and availability
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/LlmProvidersResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /mvp/generate:
    post:
      tags:
        - MVP
      operationId: generateMvp
      summary: Generate or regenerate the lead's prototype page
      description: |
        `auditId` is an audit id or, when the client has none, the lead id. The given audit is used if it is
        `COMPLETED`, otherwise the newest completed audit of the lead; a failed audit is never used.

        Generates once from `AUDITED`; a lead that already has an MVP needs `forceRegenerate: true`. Generation is
        refused while one runs and once outreach is scheduled or sent. The lead moves to `GENERATING` only if it is still
        in the status that was checked, so two requests cannot both start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateMvp'
            example:
              auditId: 6740a1f09d4e5a0012ab35aa
              forceRegenerate: false
              provider: anthropic
              operatorLocale: en
      responses:
        '202':
          description: Generation queued; poll `GET /leads/{id}` until the lead reaches `NEEDS_APPROVAL`
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - leadId
                      - auditId
                      - status
                    properties:
                      leadId:
                        $ref: '#/components/schemas/ObjectId'
                      auditId:
                        $ref: '#/components/schemas/ObjectId'
                      jobId:
                        type: string
                      status:
                        type: string
                        enum:
                          - GENERATING
              example:
                success: true
                message: MVP generation enqueued successfully
                data:
                  leadId: 6740a1f09d4e5a0012ab35aa
                  auditId: 6740a1f09d4e5a0012ab35ab
                  jobId: '17'
                  status: GENERATING
        '400':
          description: '`VALIDATION_ERROR` (unknown provider, or a model of another provider) or `LLM_PROVIDER_NOT_ALLOWED` (a dev-only provider in production)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`NO_COMPLETED_AUDIT`: the lead has no completed audit (or is not the studio''s)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `MVP_ALREADY_GENERATED` (an MVP exists and `forceRegenerate` is not set) or `MVP_GENERATION_NOT_ALLOWED`
            (generation running, outreach scheduled or sent, or the lead changed meanwhile); `details.status`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: MVP_ALREADY_GENERATED
                  message: This lead already has an MVP. Set forceRegenerate to replace it.
                  details:
                    status: NEEDS_APPROVAL
  /mvp/{id}:
    get:
      tags:
        - MVP
      operationId: getMvp
      summary: The MVP project by its id, its lead's id or its preview slug
      parameters:
        - name: id
          in: path
          required: true
          description: MVP id or lead id (ObjectId), or the preview slug
          schema:
            type: string
      responses:
        '200':
          description: The MVP project with its completeness report and versions
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/MvpProject'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/MvpNotFound'
  /mvp/preview/{slug}:
    get:
      tags:
        - MVP
      operationId: openMvpPreview
      summary: Redirect to the published prototype page
      description: 'Public, because an iframe cannot send a header; the slug is the secret. Sets `Content-Security-Policy` and `X-Frame-Options: SAMEORIGIN`.'
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to `fullPreviewUrl` in the demos bucket
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          description: '`PREVIEW_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /mvp/{id}/edit:
    post:
      tags:
        - MVP
      operationId: editMvp
      summary: Change the page in the operator's own words
      description: |
        Synchronous: the API waits up to **420 s** for the `mvp-page-queue` worker. The page model gets the current page
        and the instruction and returns the whole page; it is checked like a generation (one retry) and published as a
        new version `change`. The lead's status does not change.
      parameters:
        - $ref: '#/components/parameters/MvpIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMvp'
            example:
              instruction: Move the booking button above the services list
              operatorLocale: en
      responses:
        '200':
          $ref: '#/components/responses/MvpPageResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MvpOrLeadNotFound'
        '409':
          $ref: '#/components/responses/MvpNotChangeable'
        '502':
          $ref: '#/components/responses/MvpEditFailed'
        '504':
          $ref: '#/components/responses/MvpEditTimeout'
  /mvp/{id}/tokens:
    patch:
      tags:
        - MVP
      operationId: updateMvpTokens
      summary: Set the operator's colors and fonts over the page theme
      description: |
        Waits up to **120 s**. The stored page is re-finished and re-published with the controls, with no model call
        and no new version. Text on `bg` and `surface` must have a contrast of at least 4.5:1; fonts must be one of the
        fixed pairings (`MVP_FONT_CHOICES`); `null` removes a group.
      parameters:
        - $ref: '#/components/parameters/MvpIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMvpTokens'
            example:
              colors:
                primary: '#0f4c81'
                accent: '#f2a541'
                bg: '#ffffff'
                surface: '#f4f6f8'
                text: '#1b1f24'
              fonts:
                heading: Poppins
                body: Inter
      responses:
        '200':
          $ref: '#/components/responses/MvpPageResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MvpOrLeadNotFound'
        '409':
          $ref: '#/components/responses/MvpNotChangeable'
        '502':
          $ref: '#/components/responses/MvpEditFailed'
        '504':
          $ref: '#/components/responses/MvpEditTimeout'
  /mvp/{id}/versions/{n}/restore:
    post:
      tags:
        - MVP
      operationId: restoreMvpVersion
      summary: Re-publish a stored version of the page
      description: |
        Waits up to **120 s**. Reads `v/<slug>/versions/<n>.html`, checks it against the current audit and publishes it,
        with the current colors and fonts, as a new version `restore` (`from: n`). `applied: false, reason: unchanged`
        when it is the page already published.
      parameters:
        - $ref: '#/components/parameters/MvpIdPath'
        - name: 'n'
          in: path
          required: true
          description: Version number (from 1)
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/MvpPageResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`MVP_NOT_FOUND`, `LEAD_NOT_FOUND` or `MVP_VERSION_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`MVP_PREVIOUS_GENERATOR`, `MVP_EDIT_NOT_ALLOWED`, or `MVP_VERSION_UNUSABLE` (the version no longer fits the audit; `details.problems`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/MvpEditFailed'
        '504':
          $ref: '#/components/responses/MvpEditTimeout'
  /outreach/pending:
    get:
      tags:
        - Outreach
      operationId: listPendingOutreach
      summary: Leads waiting for the operator's approval
      description: Up to 50 leads in `NEEDS_APPROVAL`, most recently updated first.
      responses:
        '200':
          description: Leads awaiting review
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - total
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lead'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /outreach/sender:
    get:
      tags:
        - Outreach
      operationId: getStudioSender
      summary: The caller's studio sender (every role)
      description: The sender set by the studio owner (REV-221), or `configured false` when there is none yet.
      responses:
        '200':
          description: The studio sender
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - configured
                    properties:
                      configured:
                        type: boolean
                      name:
                        type: string
                        maxLength: 100
                      address:
                        type: string
                        format: email
              example:
                success: true
                data:
                  configured: true
                  name: Smile Studio
                  address: hello@smile-studio.example
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /outreach/{id}/outbox:
    get:
      tags:
        - Outreach
      operationId: getOutbox
      summary: The simulated email recorded for a lead
      description: |
        Delivery is simulated (REV-221): the email worker records the final message (From the studio sender at send
        time, unsubscribe headers and footer, open pixel) instead of delivering it. Reading it writes nothing; it is not
        an open or a click.
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      responses:
        '200':
          description: The recorded message
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - from
                      - to
                      - subject
                      - headers
                      - html
                      - text
                      - deliveryMode
                      - sentAt
                    properties:
                      from:
                        type: string
                        example: '"Smile Studio" <hello@smile-studio.example>'
                      to:
                        type: string
                        format: email
                      subject:
                        type: string
                      headers:
                        type: object
                        additionalProperties:
                          type: string
                      html:
                        type: string
                      text:
                        type: string
                      deliveryMode:
                        type: string
                        enum:
                          - SIMULATED
                      sentAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: '`LEAD_NOT_FOUND` (also another studio''s lead) or `OUTBOX_NOT_FOUND` (no email recorded for the lead)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /outreach/{id}/approve:
    post:
      tags:
        - Outreach
      operationId: approveOutreach
      summary: Approve the email (the Human-in-the-Loop gate)
      description: |
        The **only** way an email to a business is ever sent. Allowed only from `NEEDS_APPROVAL`. The lead moves to
        `SCHEDULED` and its `EmailCampaign` is written in one MongoDB transaction filtered on the status, so two
        approvals at once cannot both queue an email. The send is queued with a random delay of 15–45 s.

        `subject` and `body` are required (there is no default copy). `body` is plain text: it is stored as is and as
        escaped HTML with paragraphs and a hidden preheader. If the send cannot be queued within 5 s, the lead and
        campaign go back to `NEEDS_APPROVAL` and the answer is `503 EMAIL_QUEUE_UNAVAILABLE`.
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveOutreach'
            example:
              subject: A new home page for Smile Dental Clinic
              preheader: We rebuilt your page from your own content
              body: |-
                Hello Anna,

                we looked at smile-dental.example and made a faster, mobile-friendly version of your home page.

                Best regards,
                Pixel Studio
      responses:
        '200':
          description: Approved and queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ApprovalResult'
              example:
                success: true
                message: Email approved by operator and queued for sending
                data:
                  campaignId: 6740a8229d4e5a0012ab3610
                  leadId: 6740a1f09d4e5a0012ab35aa
                  jobId: '9'
                  status: SCHEDULED
                  delayMs: 27311
                  approvedAt: '2026-11-22T10:40:00.000Z'
                  subject: A new home page for Smile Dental Clinic
                  preheader: We rebuilt your page from your own content
        '400':
          description: '`INVALID_ID` or `VALIDATION_ERROR` (missing subject or body)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LeadNotFound'
        '409':
          description: '`LEAD_NOT_AWAITING_APPROVAL` (not in `NEEDS_APPROVAL`), `NO_CONTACT_EMAIL` (the lead has no email) `SENDER_NOT_CONFIGURED` (the studio has no sender), `BUSINESS_OPTED_OUT` (the business, or the lead''s contact address under any business, asked not to be contacted; REV-227) or `CONTACT_RIGHT_REQUIRED` (the studio holds no active right to contact the business; `details.expiredAt` when it had one; REV-226). Nothing is written or queued'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: LEAD_NOT_AWAITING_APPROVAL
                  message: Only a lead awaiting approval can be approved; this lead is SCHEDULED.
        '503':
          description: '`EMAIL_QUEUE_UNAVAILABLE`: nothing will be sent; the lead is back in review; `details.leadId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /outreach/{id}/reject:
    post:
      tags:
        - Outreach
      operationId: rejectOutreach
      summary: Reject the outreach (lead → REJECTED)
      description: Only before approval; the status filter makes the check and the update one atomic write.
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      requestBody:
