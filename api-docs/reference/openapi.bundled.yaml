  /admin/platform-audits:
    post:
      tags:
        - Admin
      operationId: requestPlatformAudit
      summary: Audit a business no studio owns yet
      description: |
        Platform administrators only (`PLATFORM_ADMIN_EMAILS`, REV-232). The business is found or created by the
        domain of `url`. A `COMPLETED` audit of the business, or a platform audit still waiting, is returned as it
        is (`200`, `queued: false`) and nothing is queued; otherwise a `platform-audit` job is queued on
        `audit-queue` (`201`). The audit has no `leadId`, no lead is created and no generation job is queued. A
        `QUEUED` or `PROCESSING` platform audit older than 30 minutes is failed and replaced by the new request.
        If the job cannot be queued within 5 s the audit is marked `FAILED` and the answer is `503`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformAudit'
            example:
              url: https://smile-dental.example
              businessName: Smile Dental Clinic
              niche: dental
              city: Vilnius
      responses:
        '200':
          description: An existing audit is returned; nothing was queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/PlatformAuditRequest'
        '201':
          description: A `platform-audit` job was queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/PlatformAuditRequest'
              example:
                success: true
                data:
                  auditId: 6740a3449d4e5a0012ab35c0
                  businessId: 6740a1f09d4e5a0012ab35a0
                  status: QUEUED
                  queued: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: '`AUDIT_QUEUE_UNAVAILABLE`: the job was not queued within 5 s; the audit is `FAILED`; `details.auditId`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/platform-audits/{id}:
    get:
      tags:
        - Admin
      operationId: getPlatformAudit
      summary: A platform audit by its id
      description: Platform administrators only. An audit that a studio's lead ran answers the same `404` as an unknown id.
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      responses:
        '200':
          description: The platform audit
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/PlatformAudit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`PLATFORM_AUDIT_NOT_FOUND`: no platform audit with this id (also for an invalid id or an audit of a lead)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/lots:
    post:
      tags:
        - Admin
      operationId: createLot
      summary: Make a DRAFT lot from the newest completed audit of a business
      description: |
        Platform administrators only. The price and band are computed by code from the audit (`priceFromAudit`,
        REV-231), never by a model. Eligibility (the business has not opted out, no contact right or cooldown is in
        force, it has a city) is checked as a write on the business in the same transaction as the insert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLot'
            example:
              businessId: 6740a1f09d4e5a0012ab35a0
      responses:
        '201':
          description: The new lot, `DRAFT`
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Lot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `NO_COMPLETED_PLATFORM_AUDIT` (the business has no completed audit), `LOT_NOT_PRICEABLE` (the audit
            measured no price signal), `LOT_NOT_ELIGIBLE` (opted out, held by a studio, in cooldown, or no city) or
            `LOT_ALREADY_LIVE` (a `DRAFT`, `OPEN` or `RESERVED` lot exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: LOT_ALREADY_LIVE
                  message: The business already has a live lot
    get:
      tags:
        - Admin
      operationId: listLots
      summary: List lots, newest first
      description: Platform administrators only.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/LotStatus'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of lots
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                  - pagination
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lot'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/lots/{id}/open:
    post:
      tags:
        - Admin
      operationId: openLot
      summary: Offer a DRAFT lot to studios
      description: |
        Platform administrators only. `DRAFT` to `OPEN` only; `releaseAt` defaults to now. A business that opted
        out, was claimed by a studio or is in cooldown since the lot was made answers `409 LOT_NOT_ELIGIBLE`.
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenLot'
            example:
              releaseAt: '2026-12-01T09:00:00.000Z'
      responses:
        '200':
          description: The open lot
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Lot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`LOT_NOT_FOUND`: no lot with this id (also for an invalid id)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`LOT_TRANSITION_NOT_ALLOWED` (the lot is not `DRAFT`) or `LOT_NOT_ELIGIBLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/lots/{id}/withdraw:
    post:
      tags:
        - Admin
      operationId: withdrawLot
      summary: Withdraw a live lot
      description: |
        Platform administrators only. `DRAFT`, `OPEN` or `RESERVED` to `WITHDRAWN` with `withdrawReason: admin`; the
        business's live-lot slot is freed. `SOLD` and `WITHDRAWN` lots cannot change.
      parameters:
        - $ref: '#/components/parameters/ObjectIdPath'
      responses:
        '200':
          description: The withdrawn lot
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Lot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: '`LOT_NOT_FOUND`: no lot with this id (also for an invalid id)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`LOT_TRANSITION_NOT_ALLOWED`: the lot is `SOLD` or `WITHDRAWN`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /lots:
    get:
      tags:
        - Lots
      operationId: listMaskedLots
      summary: Open lots as a studio may see them before buying
      description: |
        Every studio member, viewers included (REV-233). Lists `OPEN` lots whose `releaseAt` has passed, newest first
        (`releaseAt` descending, then `_id`). Nothing that identifies the business is returned: an item is parsed
        with a strict allow-list schema, and a field outside it would answer `500` instead of being sent. Signals are
        levels (`low` below one third of the need, `medium` below two thirds, else `high`), `releaseAt` is cut to
        the minute, and the price is rounded to `LOT_PRICE_STEP_CENTS`.

        A group of (`niche`, `city`, `band`) with fewer than `LOT_LISTING_MIN_GROUP` (3) listed lots is withheld.
        Groups use the city as stored, so a differently written city hides the lot (fails safe).

        Requests are limited per studio: `LOT_LISTING_RATE_LIMIT` (30) per `LOT_LISTING_RATE_WINDOW_SECONDS` (60),
        a fixed window in Redis. The query is validated first, so a `400` uses no budget. When the limit store does
        not answer within 500 ms the request is refused with `503 LISTINGS_UNAVAILABLE`.
      parameters:
        - name: niche
          in: query
          schema:
            $ref: '#/components/schemas/Niche'
        - name: city
          in: query
          description: Case-insensitive, matched against the whole city name
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: band
          in: query
          schema:
            type: string
            enum:
              - A
              - B
              - C
              - D
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: A page of masked lots
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - items
                      - total
                      - page
                      - limit
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/MaskedLot'
                      total:
                        type: integer
                        description: Listed lots matching the filters; withheld groups are not counted
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          description: '`RATE_LIMITED`: the studio used its requests for this window; `details.retryAfterSeconds`'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the window ends
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: RATE_LIMITED
                  message: Too many requests, try again later
                  details:
                    retryAfterSeconds: 12
        '503':
          description: '`LISTINGS_UNAVAILABLE`: the limit store (Redis) is not ready or did not answer in 500 ms; the request is refused, not let through'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /track/open/{token}.gif:
    get:
      tags:
        - Tracking
      operationId: trackEmailOpen
      summary: Email open pixel (lead → OPENED)
      description: Public. Always answers the 1×1 transparent GIF with no-cache headers; an unknown token moves no lead. Also served at `/track/open/{token}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingToken'
      responses:
        '200':
          description: 43-byte transparent GIF
          content:
            image/gif:
              schema:
                type: string
                format: binary
  /track/click/{token}:
    get:
      tags:
        - Tracking
      operationId: trackEmailClick
      summary: Link in the email (lead → CLICKED), redirects to the prototype
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingToken'
      responses:
        '302':
          description: Redirect to the published prototype
          headers:
            Location:
              schema:
                type: string
                format: uri
  /track/mvp-event:
    post:
      tags:
        - Tracking
      operationId: trackMvpEvent
      summary: Beacon from the published prototype page
      description: |
        Public; sent with `navigator.sendBeacon` by `revamp-tracker.js`. The lead moves to `ENGAGED` on a dwell time of
        at least 30 s or on a CTA or booking interaction. Allowed origins: the dashboard, the demos storage and `https://{PREVIEW_DOMAIN}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MvpTrackEvent'
            example:
              trackingToken: 3f9c1e0a7b2d4c58a61e0f4b9d2c7a11
              eventType: dwell_time
              dwellTimeSeconds: 42
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - engaged
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  engaged:
                    type: boolean
                    description: Whether this event moved the lead to ENGAGED
        '400':
          $ref: '#/components/responses/ValidationError'
  /track/unsubscribe/{token}:
    parameters:
      - $ref: '#/components/parameters/TrackingToken'
    get:
      tags:
        - Tracking
      operationId: showUnsubscribePage
      summary: Unsubscribe confirmation page (changes nothing)
      description: Mail scanners open every link in an email, so a GET never unsubscribes (RFC 8058); the page posts back to the same URL.
      security: []
      responses:
        '200':
          description: HTML confirmation page (or "You are unsubscribed" when already done)
          content:
            text/html:
              schema:
                type: string
        '404':
          description: HTML page "Link not recognised"
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
        - Tracking
      operationId: unsubscribe
      summary: One-click unsubscribe (RFC 8058)
      description: |
        Lead and campaign → `UNSUBSCRIBED`. The opt-out then applies to every studio (REV-227): the business is opted
        out, a SHA-256 hash of the recipient address is stored (never the address), the business's contact right ends,
        every studio's lead for the business moves to `UNSUBSCRIBED` and their unsent campaigns are closed. The answer is
        the same as before and reveals no other studio. Idempotent: a repeat completes an interrupted opt-out and
        changes nothing else; an unknown token changes nothing.
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                List-Unsubscribe:
                  type: string
                  enum:
                    - One-Click
      responses:
        '200':
          description: HTML page "You are unsubscribed"
          content:
            text/html:
              schema:
                type: string
        '404':
          description: HTML page "Link not recognised"
          content:
            text/html:
              schema:
                type: string
  /track/revamp-tracker.js:
    get:
      tags:
        - Tracking
      operationId: getTrackerScript
      summary: Tracking script loaded by the prototype pages
      description: '`Cross-Origin-Resource-Policy: cross-origin` so a page served from the storage host can load it; cached for 1 hour.'
      security: []
      responses:
        '200':
          description: JavaScript
          content:
            application/javascript:
              schema:
                type: string
components:
  headers:
    RateLimitLimit:
      description: Requests allowed per studio in the window
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in the current window
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 token from `POST /auth/register`, `POST /auth/login`, `POST /invitations/{token}/join` or
        `POST /invitations/{token}/accept`. Claims: `sub` (user id), `org` (studio id), `role` (ignored: the role is
        read from the database on every request). Lifetime 7 days; there is no refresh token and no server-side logout.
  parameters:
    ObjectIdPath:
      name: id
      in: path
      required: true
      description: 24-character hexadecimal MongoDB ObjectId
      schema:
        $ref: '#/components/schemas/ObjectId'
    MvpIdPath:
      name: id
      in: path
      required: true
      description: The MVP project's `_id`
      schema:
        $ref: '#/components/schemas/ObjectId'
    InvitationToken:
      name: token
      in: path
      required: true
      description: The one-time invitation token from the join link
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,128}$
    DiscoveryJobId:
      name: jobId
      in: path
      required: true
      description: BullMQ job id returned by `POST /discovery`
      schema:
        type: string
    TrackingToken:
      name: token
      in: path
      required: true
      description: The campaign's tracking token (32 hexadecimal characters)
      schema:
        type: string
  responses:
    Ok:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required:
              - success
            properties:
              success:
                type: boolean
                enum:
                  - true
    ValidationError:
      description: '`VALIDATION_ERROR` (Zod: `message` is the first issue, `details.issues` all of them), `INVALID_JSON`, or `INVALID_ID`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: 'password: String must contain at least 10 character(s)'
              details:
                issues:
                  - code: too_small
                    minimum: 10
                    type: string
                    inclusive: true
                    message: String must contain at least 10 character(s)
                    path:
                      - password
    InvalidId:
      description: '`INVALID_ID`: not a 24-character hexadecimal ObjectId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INVALID_ID
              message: A valid 24-character hexadecimal ObjectId is required
    Unauthenticated:
      description: '`UNAUTHENTICATED`: no bearer token, a wrong or expired token, or the membership no longer exists'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHENTICATED
              message: Sign in to use the API
    Forbidden:
      description: '`FORBIDDEN`: a viewer tried to change data, a non-owner called `/organization/*`, or a user who is not a platform administrator called `/admin/*`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: Your role can read but not change data
    LeadNotFound:
      description: '`LEAD_NOT_FOUND` (also for a lead of another studio)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: LEAD_NOT_FOUND
              message: Lead not found
    MvpNotFound:
      description: '`MVP_NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MvpOrLeadNotFound:
      description: '`MVP_NOT_FOUND` or `LEAD_NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MvpNotChangeable:
      description: |
        `MVP_PREVIOUS_GENERATOR` (made by the previous generator: only a regeneration applies) or `MVP_EDIT_NOT_ALLOWED`
        (the lead is not in `NEEDS_APPROVAL`; `details.status`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MvpEditFailed:
      description: |
        `MVP_EDIT_FAILED`: nothing was published. `details.reason` is `not_configured`, `call_failed` or `invalid_page`;
        `details.problems` lists failed page checks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MVP_EDIT_FAILED
              message: 'The change was not applied: the page writes a phone number instead of {{phone}}'
              details:
                reason: invalid_page
                problems:
                  - code: page:contact
                    message: the page writes a phone number instead of {{phone}}
    MvpEditTimeout:
      description: '`MVP_EDIT_TIMEOUT`: the worker did not finish in time; `message` says whether the change may still be published'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MvpPageResult:
      description: The result of the change and the MVP as saved after it
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - data
            properties:
              success:
                type: boolean
                enum:
                  - true
              message:
                type: string
              data:
                type: object
                required:
                  - applied
                  - mvp
                properties:
                  applied:
                    type: boolean
                  version:
                    type: integer
                    description: The version published (absent for colors and fonts)
                  reason:
                    type: string
                    enum:
                      - unchanged
                  mvp:
                    $ref: '#/components/schemas/MvpProject'
          example:
            success: true
            message: Change applied; the published MVP was re-published
            data:
              applied: true
              version: 3
              mvp:
                _id: 6740a5119d4e5a0012ab35e1
                leadId: 6740a1f09d4e5a0012ab35aa
                previewSlug: smile-dental-k3v9
                fullPreviewUrl: http://localhost:9000/revamp-demos/v/smile-dental-k3v9/index.html
    AuditQueueUnavailable:
      description: '`AUDIT_QUEUE_UNAVAILABLE`: the lead was saved but its audit was not queued within 5 s; the lead is `AUDIT_FAILED`; `details.leadId`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvitationNotFound:
      description: '`INVITATION_NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvitationExpired:
      description: '`INVITATION_EXPIRED`: expired, already used or revoked'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvitationEmailMismatch:
      description: '`INVITATION_EMAIL_MISMATCH`: the invitation is for another address'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MemberNotFound:
      description: '`MEMBER_NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LastOwner:
      description: '`LAST_OWNER`: the studio would be left without an owner'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DiscoveryJobNotFound:
      description: '`DISCOVERY_JOB_NOT_FOUND` (also for a job of another studio)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      example: 6740a1f09d4e5a0012ab35aa
    ApiErrorCode:
      type: string
      description: '`API_ERROR_CODES` in `@revamp/shared-types`; meaning and recovery of each in `guides/errors.md`'
      enum:
        - VALIDATION_ERROR
        - INVALID_ID
        - INVALID_JSON
        - PAYLOAD_TOO_LARGE
        - DUPLICATE
        - NOT_FOUND
        - INTERNAL
        - INVALID_URL
        - LEAD_NOT_FOUND
        - LEAD_NOT_AUDITABLE
        - AUDIT_NOT_FOUND
        - AUDIT_QUEUE_UNAVAILABLE
        - EMAIL_QUEUE_UNAVAILABLE
        - LLM_PROVIDER_NOT_ALLOWED
        - NO_COMPLETED_AUDIT
        - MVP_GENERATION_NOT_ALLOWED
        - MVP_ALREADY_GENERATED
        - MVP_NOT_FOUND
        - MVP_EDIT_NOT_ALLOWED
        - MVP_EDIT_FAILED
        - MVP_EDIT_TIMEOUT
        - MVP_PREVIOUS_GENERATOR
        - MVP_VERSION_NOT_FOUND
        - MVP_VERSION_UNUSABLE
        - PREVIEW_NOT_FOUND
        - LEAD_NOT_AWAITING_APPROVAL
        - LEAD_NOT_REJECTABLE
        - NO_CONTACT_EMAIL
        - SENDER_NOT_CONFIGURED
        - CONTACT_RIGHT_REQUIRED
        - OUTBOX_NOT_FOUND
        - EMAIL_TEST_TIMEOUT
        - EMAIL_SEND_FAILED
        - DISCOVERY_JOB_NOT_FOUND
        - DISCOVERY_JOB_NOT_COMPLETED
        - GEOCODING_UNAVAILABLE
        - PLACE_NOT_FOUND
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - EMAIL_TAKEN
        - FORBIDDEN
        - ALREADY_MEMBER
        - LAST_OWNER
        - MEMBER_NOT_FOUND
        - INVITATION_NOT_FOUND
        - INVITATION_EXPIRED
        - INVITATION_EMAIL_MISMATCH
        - LEAD_ALREADY_EXISTS
        - CONTACT_RIGHT_HELD
        - BUSINESS_IN_COOLDOWN
        - BUSINESS_OPTED_OUT
        - LOT_NOT_FOUND
        - LOT_NOT_ELIGIBLE
        - LOT_ALREADY_LIVE
        - LOT_NOT_PRICEABLE
        - LOT_TRANSITION_NOT_ALLOWED
        - PLATFORM_AUDIT_NOT_FOUND
        - NO_COMPLETED_PLATFORM_AUDIT
        - RATE_LIMITED
        - LISTINGS_UNAVAILABLE
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              $ref: '#/components/schemas/ApiErrorCode'
            message:
              type: string
              description: Readable text for the operator; never parse it
            details:
              description: Machine-readable context, e.g. `{ status }`, `{ leadId }`, `{ issues }` or `{ reason, problems }`
              type: object
              additionalProperties: true
    Health:
      type: object
      required:
        - status
        - timestamp
        - services
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            api:
              type: string
              enum:
                - healthy
            mongodb:
              type: string
              enum:
                - connected
                - connecting
                - disconnected
            redis:
              type: string
              description: '`connected`, or the ioredis status (`reconnecting`, `end`, …)'
    Role:
      type: string
      enum:
        - owner
        - operator
        - viewer
    AuthContext:
      type: object
      required:
        - user
        - organization
        - role
      properties:
        user:
          type: object
          required:
            - id
            - email
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            email:
              type: string
              format: email
            name:
              type: string
        organization:
          type: object
          required:
            - id
            - name
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            name:
              type: string
        role:
          $ref: '#/components/schemas/Role'
        platformAdmin:
          type: boolean
          description: Only in `GET /auth/me`. True when the user's email is in `PLATFORM_ADMIN_EMAILS` (REV-232); only then do `/admin/*` routes answer
    AuthSession:
      allOf:
        - $ref: '#/components/schemas/AuthContext'
        - type: object
          required:
            - token
          properties:
            token:
              type: string
              description: The bearer token (JWT, 7 days)
    AuthSessionEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/AuthSession'
    Invitation:
      type: object
      required:
        - id
        - email
        - role
        - expiresAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreatedInvitation:
      type: object
      required:
        - invitation
        - token
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        token:
          type: string
          description: Shown once; build the link `/invite/<token>`
    InvitationPreview:
      type: object
      required:
        - organizationName
        - email
        - role
        - expiresAt
      properties:
        organizationName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        expiresAt:
          type: string
          format: date-time
    OrganizationMembers:
      type: object
      required:
        - members
        - invitations
      properties:
        members:
          type: array
          items:
            type: object
            required:
              - userId
              - email
              - role
              - joinedAt
            properties:
              userId:
                $ref: '#/components/schemas/ObjectId'
              email:
                type: string
                format: email
              name:
                type: string
              role:
                $ref: '#/components/schemas/Role'
              joinedAt:
                type: string
                format: date-time
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    LeadStatus:
      type: string
      description: Lead lifecycle; allowed moves are `LEAD_TRANSITIONS` in `@revamp/validation` (see `guides/concepts.md`)
      enum:
        - QUEUED
        - AUDITING
        - AUDIT_FAILED
        - AUDITED
        - GENERATING
        - NEEDS_APPROVAL
        - SCHEDULED
        - SENT
        - OPENED
        - CLICKED
        - ENGAGED
        - REJECTED
        - UNSUBSCRIBED
    Niche:
      type: string
      enum:
        - dental
        - auto
        - legal
        - beauty
        - construction
        - medical
        - restaurant
        - fitness
        - real_estate
        - other
    Lead:
      type: object
      description: '`ILead` in `@revamp/shared-types`; dates are ISO strings'
      required:
        - _id
        - businessName
        - originalUrl
        - domain
        - niche
        - status
        - tags
        - createdAt
        - updatedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        tenantId:
          $ref: '#/components/schemas/ObjectId'
        businessId:
          $ref: '#/components/schemas/ObjectId'
        businessName:
          type: string
        originalUrl:
          type: string
          format: uri
        domain:
          type: string
        niche:
          $ref: '#/components/schemas/Niche'
        city:
          type: string
        contactEmail:
          type: string
          format: email
          description: Absent until entered or found on the site; never invented
        contactPhone:
          type: string
        phoneE164:
          type: string
        source:
          type: string
          enum:
            - manual
            - osm
            - google
        externalId:
          type: string
          example: osm:node/2918273645
        operatorLocale:
          type: string
          enum:
            - en
            - ru
            - be
            - pl
            - lt
        ownerName:
          type: string
        status:
          $ref: '#/components/schemas/LeadStatus'
        totalScore:
          type: number
          minimum: 0
          maximum: 100
        tags:
          type: array
          items:
            type: string
        previewUrl:
          type: string
          format: uri
        comparisonBannerUrl:
          type: string
          format: uri
        mvpGeneratedAt:
          type: string
          format: date-time
        generationError:
          type: string
        generationFailure:
          type: object
          description: Why the model gave no page
          properties:
            code:
              type: string
            reason:
              type: string
              enum:
                - not_configured
                - call_failed
                - invalid_page
            message:
              type: string
            at:
              type: string
              format: date-time
        auditError:
          type: string
        contactRight:
          type: object
          nullable: true
          description: The studio's newest contact right on the lead's business (REV-228); null when it has none. Never another studio's right.
          required:
            - expiresAt
            - active
          properties:
            expiresAt:
              type: string
              format: date-time
            active:
              type: boolean
              description: Granted, not expired and not ended at the time of the request
            endedAt:
              type: string
              format: date-time
            endReason:
              type: string
              enum:
                - opted_out
        outreachError:
          type: object
          description: Why the email worker stopped a send and returned the lead to review (REV-226); cleared by the next approval
          required:
            - code
            - message
            - at
          properties:
            code:
              type: string
              enum:
                - CONTACT_RIGHT_EXPIRED
                - CONTACT_OPTED_OUT
            message:
              type: string
              maxLength: 500
            at:
              type: string
              format: date-time
        siteComplexity:
          type: string
          enum:
            - ONE_PAGE_BROCHURE
            - SMALL_MULTI_PAGE
            - COMPLEX
            - UNKNOWN
        onePageBrochure:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LeadListItem:
      allOf:
        - $ref: '#/components/schemas/Lead'
        - type: object
          properties:
            completeness:
              $ref: '#/components/schemas/MvpCompletenessSummary'
    LeadStats:
      type: object
      required:
        - total
        - byStatus
      properties:
        total:
          type: integer
        byStatus:
          type: object
          description: Count per status; statuses with no lead are absent
          additionalProperties:
            type: integer
    PlatformAuditRequest:
      type: object
      required:
        - auditId
        - businessId
        - status
        - queued
      properties:
        auditId:
          $ref: '#/components/schemas/ObjectId'
        businessId:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum:
            - QUEUED
            - PROCESSING
            - COMPLETED
            - FAILED
        queued:
          type: boolean
          description: True when this request queued a new job
    PlatformAudit:
      type: object
      description: The result of a platform audit (an `Audit` with no `leadId`)
      required:
        - auditId
        - status
        - measurementErrors
      properties:
        auditId:
          $ref: '#/components/schemas/ObjectId'
        businessId:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum:
            - QUEUED
            - PROCESSING
            - COMPLETED
            - FAILED
        scores:
          type: object
          additionalProperties: true
          description: Same pillar scores as `Audit.scores`; a failed measurement is absent
        measurementErrors:
          type: array
          items:
            type: object
            required:
              - measurement
              - message
            properties:
              measurement:
                type: string
                enum:
                  - performance
                  - accessibility
                  - standards
                  - design
              message:
                type: string
        completedAt:
          type: string
          format: date-time
        errorMessage:
          type: string
    LotStatus:
      type: string
      description: |
        `DRAFT` to `OPEN` or `WITHDRAWN`; `OPEN` to `RESERVED` or `WITHDRAWN`; `RESERVED` to `OPEN`, `SOLD` or
        `WITHDRAWN`; `SOLD` and `WITHDRAWN` are final (`LOT_TRANSITIONS`)
      enum:
        - DRAFT
        - OPEN
        - RESERVED
        - SOLD
        - WITHDRAWN
    Lot:
      type: object
      description: '`ILot` in `@revamp/shared-types`. A priced offer of one business and its audit; the platform owns it until a studio buys it.'
      required:
        - _id
        - businessId
        - auditId
        - niche
        - city
        - priceCents
        - currency
        - band
        - need
        - priceSignals
        - status
        - createdAt
        - updatedAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        businessId:
          $ref: '#/components/schemas/ObjectId'
        auditId:
          $ref: '#/components/schemas/ObjectId'
        niche:
          $ref: '#/components/schemas/Niche'
        city:
          type: string
          maxLength: 100
        priceCents:
          type: integer
          minimum: 0
          description: In minor units of `currency`
        currency:
          type: string
          example: EUR
        band:
          type: string
          enum:
            - A
            - B
            - C
            - D
          description: A is the strongest case for a redesign
        need:
          type: number
          minimum: 0
          maximum: 1
        priceSignals:
          type: array
          items:
            type: object
            required:
              - signal
              - value
              - need
              - weight
            properties:
              signal:
                type: string
              value:
                type: number
              need:
                type: number
              weight:
                type: number
        status:
          $ref: '#/components/schemas/LotStatus'
        releaseAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
        withdrawReason:
          type: string
          enum:
            - admin
            - claimed_by_studio
            - opted_out
        live:
          type: boolean
          description: True while the lot is `DRAFT`, `OPEN` or `RESERVED`; absent after `SOLD` or `WITHDRAWN`
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MaskedLot:
      type: object
      description: '`IMaskedLot` in `@revamp/shared-types`. The only shape of a listed lot (strict `MaskedLotSchema`): no business, audit, name, domain, contact or exact measurement.'
      required:
        - id
        - niche
        - city
        - band
        - priceCents
        - currency
        - releaseAt
        - signals
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        niche:
          $ref: '#/components/schemas/Niche'
        city:
          type: string
          maxLength: 100
        band:
          type: string
          enum:
            - A
            - B
            - C
            - D
        priceCents:
          type: integer
          minimum: 0
          description: Rounded to `LOT_PRICE_STEP_CENTS`
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          example: EUR
        releaseAt:
          type: string
          format: date-time
          description: Truncated to the minute
        signals:
          type: array
          maxItems: 4
          items:
            type: object
            required:
              - signal
              - level
            additionalProperties: false
            properties:
              signal:
                type: string
                enum:
                  - siteEra
                  - accessibility
                  - standards
                  - lcp
              level:
                type: string
                enum:
                  - low
                  - medium
                  - high
    Pagination:
      type: object
      required:
        - total
        - page
        - limit
        - totalPages
      properties:
        total:
          type: integer
          description: Leads matching the filters
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
    Audit:
      type: object
      description: |
        `IAudit` in `@revamp/shared-types`. Every number is measured by code (Playwright, axe-core, in-page web vitals);
        a measurement that failed is **absent** and listed in `measurementErrors`, never replaced by a stand-in value.
        Nested objects are summarised here; their full shape is in `database-expertise.md` §4.2.
      required:
        - _id
        - status
        - createdAt
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        leadId:
          $ref: '#/components/schemas/ObjectId'
          description: Absent on a platform audit (REV-232)
        businessId:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum:
            - QUEUED
            - PROCESSING
            - COMPLETED
            - FAILED
        scores:
          type: object
          description: Pillar scores 0–100; `total` is weighted over the pillars that were measured
          properties:
            total:
              type: number
            performance:
              type: number
            accessibility:
              type: number
            standards:
              type: number
            design:
              type: number
              description: Absent when the design critique is the templated fallback
          required:
            - total
        webVitals:
          type: object
          properties:
            lcp:
              type: number
              description: Largest Contentful Paint, ms (buffered PerformanceObserver, no Lighthouse)
            cls:
              type: number
              description: Cumulative Layout Shift
        standardsChecks:
          type: object
          additionalProperties: true
          description: HTTPS, viewport, meta description, single H1, …
        a11ySummary:
          type: object
          additionalProperties: true
        axeViolations:
          type: array
          items:
            type: object
            additionalProperties: true
        measurementErrors:
          type: array
          items:
            type: object
            properties:
              measurement:
                type: string
                enum:
                  - performance
                  - accessibility
                  - standards
                  - design
              message:
                type: string
        designCritique:
          type: object
          additionalProperties: true
          description: Vision model's critique (validated by `DesignCritiqueOutputSchema`)
        extractedBrandTokens:
          type: object
          additionalProperties: true
        extractedContacts:
          type: object
          additionalProperties: true
          description: Phones, emails, address found in the DOM by code
        extractedContent:
          type: object
          additionalProperties: true
        extractedServices:
          type: array
          items:
            type: string
        siteComplexity:
          type: object
          additionalProperties: true
        siteEra:
          type: object
          additionalProperties: true
        screenshotUrls:
          type: object
          properties:
            desktopOriginal:
              type: string
              format: uri
            mobileOriginal:
              type: string
              format: uri
            desktopFull:
              type: string
              format: uri
            mobileFull:
              type: string
              format: uri
            comparisonBanner:
              type: string
              format: uri
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    MvpCompletenessSummary:
      type: object
      required:
        - status
        - hasCriticalIssues
        - criticalIssues
      properties:
        status:
          type: string
          enum:
            - verified
            - unverified
        score:
          type: number
          minimum: 0
          maximum: 100
        hasCriticalIssues:
          type: boolean
        criticalIssues:
          type: array
          items:
            type: string
    MvpPageVersion:
      type: object
      required:
        - 'n'
        - kind
        - storagePath
        - createdAt
      properties:
        'n':
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
            - generate
            - change
            - restore
        instruction:
          type: string
        from:
          type: integer
        provider:
          type: string
        model:
